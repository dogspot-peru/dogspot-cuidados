name: DogSpot runtime validation
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'index-runtime-*.js'
      - 'index-care-*.js'
      - 'index-location-*.js'
      - 'dogspot-location.mjs'
      - 'dogspot-coverage-data.mjs'
      - 'vendor/leaflet/**'
      - 'maintenance/*location*'
      - 'dogspot-care-demo.mjs'
      - 'dogspot-experience.mjs'
      - 'maintenance/test-experience.mjs'
      - 'maintenance/apply-experience.py'
      - 'dogspot-runtime.mjs'
      - 'dogspot-onboarding.mjs'
      - 'dogspot-make.mjs'
      - 'integration/DogSpotMake.gs'
      - 'email-config.json'
      - 'maintenance/test-make.mjs'
      - 'maintenance/*runtime*'
      - '.github/workflows/dogspot-runtime-validation.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'index-runtime-*.js'
      - 'index-care-*.js'
      - 'index-location-*.js'
      - 'dogspot-location.mjs'
      - 'dogspot-coverage-data.mjs'
      - 'vendor/leaflet/**'
      - 'maintenance/*location*'
      - 'dogspot-care-demo.mjs'
      - 'dogspot-experience.mjs'
      - 'maintenance/test-experience.mjs'
      - 'maintenance/apply-experience.py'
      - 'dogspot-runtime.mjs'
      - 'dogspot-onboarding.mjs'
      - 'dogspot-make.mjs'
      - 'integration/DogSpotMake.gs'
      - 'email-config.json'
      - 'maintenance/test-make.mjs'
      - 'maintenance/*runtime*'
      - '.github/workflows/dogspot-runtime-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check syntax of the active published module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          html = Path('index.html').read_text(encoding='utf-8')
          name = re.search(r'src="\./(index-(?:runtime|care|location)-[a-f0-9]+\.js)"', html).group(1)
          subprocess.run(['node', '--input-type=module', '--check'], input=Path(name).read_text(encoding='utf-8'), text=True, check=True)
          PY
          node --check dogspot-runtime.mjs
          node --check dogspot-onboarding.mjs
          node --check dogspot-make.mjs
          node --check < integration/DogSpotMake.gs
          node --check dogspot-care-demo.mjs
          node --check dogspot-experience.mjs
          node --check dogspot-location.mjs
          node --check dogspot-coverage-data.mjs
      - name: Verify authentication, recovery and queued data without external requests
        run: |
          node maintenance/test-runtime-fixes.mjs
          node --test maintenance/test-care-demo.mjs
          node --test maintenance/test-experience.mjs
          node --test maintenance/test-location.mjs
          node --test maintenance/test-make.mjs
